name: Build APK

# Kapan workflow ini jalan:
# - setiap push ke branch main
# - atau ditekan manual dari tab "Actions" (tombol "Run workflow")
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Izin menulis rilis (dibutuhkan untuk membuat GitHub Release).
    permissions:
      contents: write

    steps:
      # 1. Ambil kode dari repo
      - name: Checkout kode
        uses: actions/checkout@v4

      # 2. Siapkan Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build web app (menghasilkan folder dist/)
      - name: Build web
        run: npm run build
        env:
          VITE_APP_VERSION: 1.0.${{ github.run_number }}

      # 5. Siapkan Java (dibutuhkan Android/Gradle)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 6. Siapkan Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 7. Salin hasil build web ke project Android
      - name: Capacitor sync
        run: npx cap sync android

      # 8. Decode keystore dari GitHub Secrets ke file sementara
      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Secret $name belum diisi di repository settings."
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/catatuang-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "Keystore hasil decode kosong. Periksa isi ANDROID_KEYSTORE_BASE64."
            exit 1
          fi
          chmod 600 "$KEYSTORE_PATH"
          echo "CATATUANG_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "CATATUANG_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CATATUANG_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "CATATUANG_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "CATATUANG_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "CATATUANG_VERSION_NAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      # 9. Build APK (versi release — signed dengan keystore permanen)
      - name: Build APK release
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      # 10. Verifikasi APK signed
      - name: Verifikasi signing APK
        run: |
          set -euo pipefail
          APK_PATH=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK_PATH" ]; then
            echo "APK release tidak ditemukan!"
            exit 1
          fi
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            echo "apksigner tidak ditemukan di $APKSIGNER"
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK_PATH"
          "$APKSIGNER" verify --print-certs "$APK_PATH" | head -n 5

      # 11. Ubah nama APK jadi ramah (CatatUang.apk)
      - name: Ganti nama APK
        run: cp android/app/build/outputs/apk/release/app-release.apk CatatUang.apk

      # 12. Upload APK sebagai artifact (cadangan, bisa diunduh dari halaman run)
      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: CatatUang-apk
          path: CatatUang.apk
          if-no-files-found: error

      # 13. Terbitkan GitHub Release dengan APK terlampir.
      #     Hanya jalan untuk push ke main (bukan saat dites manual biasa).
      #     Tiap build dapat nomor versi otomatis: v1.0.<nomor-build>
      - name: Terbitkan Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: CatatUang v1.0.${{ github.run_number }}
          files: CatatUang.apk
          generate_release_notes: true
          body: |
            ## Catatan Update

            **Versi ini memakai sistem signing permanen.**

            Jika versi sebelumnya gagal diperbarui (error "app not installed" / bentrok signing):
            1. Export data CSV dari aplikasi lama
            2. Uninstall aplikasi lama
            3. Install APK ini
            4. Import kembali data CSV

            Setelah migrasi satu kali ini, update berikutnya dapat dipasang langsung tanpa kehilangan data.

      # 14. Bersihkan keystore sementara
      - name: Cleanup keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/catatuang-release.jks"
